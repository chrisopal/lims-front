name: LIMS enterprise validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lims-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
          run_install: false
      - name: Record environment and exact source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts
          { node --version; pnpm --version; git rev-parse HEAD; uname -sr; } | tee qa-artifacts/environment.log
          git archive HEAD -o qa-artifacts/source.tar
      - name: Install locked application dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile 2>&1 | tee qa-artifacts/install.log
          git diff --exit-code -- package.json pnpm-lock.yaml
      - name: Production build
        shell: bash
        run: |
          set -euo pipefail
          pnpm build 2>&1 | tee qa-artifacts/build.log
          tar -cf qa-artifacts/dist.tar dist
      - name: Install isolated browser test tooling
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix .qa-tools --no-save --package-lock=false playwright@1.59.0
          .qa-tools/node_modules/.bin/playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Check production preview in Chromium
        shell: bash
        env:
          QA_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          pnpm preview --host 127.0.0.1 --port 4173 --strictPort > qa-artifacts/preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          READY=0
          for n in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then READY=1; break; fi
            sleep 1
          done
          test "$READY" = 1
          RESULT=0
          node scripts/qa/browser-check.mjs 2>&1 | tee qa-artifacts/browser.log || RESULT=1
          node scripts/qa/interaction-check.mjs 2>&1 | tee qa-artifacts/interaction.log || RESULT=1
          exit "$RESULT"
      - name: Upload evidence even when a check fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lims-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14
